name: CICD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual trigger

permissions:
  contents: read

jobs:
  verify:
    # macos: the shellspec suite drives the real scripts, which use BSD sed/zsh
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise tools (shellcheck, shfmt)
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Install ShellSpec
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/shellspec-install.sh \
            https://raw.githubusercontent.com/shellspec/shellspec/f2d13f991885ef44e6b54e571e0842222251b111/install.sh
          echo "4cac73d958d1ca8c502f3aff1a3b3cfa46ab0062f81f1cc522b83b7b2b302175  /tmp/shellspec-install.sh" | sha256sum -c -
          sh /tmp/shellspec-install.sh --yes

      - name: Install gawk
        run: brew install gawk

      - name: Verify
        run: mise run verify

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/macsetup.tar.gz
            dist/macsetup.tar.gz.sha256
            dist/install.sh
          retention-days: 7

  sonar:
    needs: [verify]
    # kcov isn't packaged for ubuntu-latest (24.04/noble) — pinned to 22.04 where it is
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ShellSpec
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/shellspec-install.sh \
            https://raw.githubusercontent.com/shellspec/shellspec/f2d13f991885ef44e6b54e571e0842222251b111/install.sh
          echo "4cac73d958d1ca8c502f3aff1a3b3cfa46ab0062f81f1cc522b83b7b2b302175  /tmp/shellspec-install.sh" | sha256sum -c -
          sh /tmp/shellspec-install.sh --yes

      - name: Install kcov and zsh
        run: sudo apt-get update && sudo apt-get install -y kcov zsh

      # kcov's line-tracing only works on Linux (a no-op on macOS, where `verify` runs) —
      # this is the one place coverage data is generated, feeding sonar.coverage.reportPaths.
      - name: Run tests with coverage
        run: "$HOME/.local/bin/shellspec --kcov tests/"

      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      needs.verify.result == 'success'
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: read_version
        run: |
          version="$(cat VERSION)"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf 'error: VERSION is not valid semver: %s\n' "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/

      - name: Create and push tag
        id: tag
        run: |
          tag="v${{ steps.read_version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            printf '%s\n' "Tag $tag already exists, skipping release."
            printf 'tag_pushed=false\n' >> "$GITHUB_OUTPUT"
          else
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
            printf 'tag_pushed=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.tag.outputs.tag_pushed == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.read_version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/macsetup.tar.gz
            dist/macsetup.tar.gz.sha256
            dist/install.sh
