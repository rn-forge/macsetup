[tools]
shellcheck = "0.11.0"
shfmt = "3.13.1"
uv = "0.12.7"

[tasks.format]
description = "Format all shell scripts with shfmt"
run = "shfmt -w -i 2 src/ scripts/"

[tasks.format-check]
description = "Check shell scripts are formatted — exits non-zero and shows diff if any differ"
run = "shfmt -d -i 2 src/ scripts/"

[tasks.lint]
description = "Lint all shell scripts with shellcheck"
run = "shellcheck $(find src scripts -name '*.sh' | sort)"

[tasks.test]
description = "Run the ShellSpec suite (shell fixed to zsh via .shellspec)"
run = "shellspec tests/"

[tasks.test-coverage]
description = "Run the ShellSpec suite under kcov, producing coverage/sonarqube.xml (Linux only — kcov's line tracing is a no-op on macOS)"
run = "shellspec --kcov tests/"

[tasks.build]
description = "Generate the dist/macsetup tree and dist/macsetup.tar.gz release tarball"
run = "bash scripts/build.sh"

[tasks.docs]
description = "Generate shell reference docs from shdoc annotations under src/"
run = "bash scripts/gen-docs.sh"

[tasks.docs-site]
description = "Build the MkDocs site into site/, or the given dir (strict — broken links fail the build)"
depends = ["docs"]
usage = '''
arg "[site_dir]" default="site" help="Directory to build the site into"
'''
run = "uv run --with mkdocs-material mkdocs build --strict --site-dir \"${usage_site_dir}\""

[tasks.docs-serve]
description = "Serve the docs site locally with live reload on http://127.0.0.1:8082"
run = "uv run --with mkdocs-material mkdocs serve -a 0.0.0.0:8082"

[tasks.clean]
description = "Remove generated dist/ artifacts"
run = "rm -rf dist/"

[tasks.bump]
description = "Bump VERSION (patch|minor|major) — writes VERSION only; review and commit yourself"
usage = '''
arg "<part>" help="Which part to bump" {
  choices "patch" "minor" "major"
}
'''
run = """
IFS=. read -r major minor patch <VERSION || true
case "${usage_part?}" in
  major) major=$((major + 1)); minor=0; patch=0 ;;
  minor) minor=$((minor + 1)); patch=0 ;;
  patch) patch=$((patch + 1)) ;;
esac
printf '%s.%s.%s' "$major" "$minor" "$patch" >VERSION
echo "Bumped VERSION to $(cat VERSION)"
"""

[tasks.verify]
description = "Full pipeline: format-check, lint, test, build, docs, docs-site"
depends = ["format-check", "lint", "test", "build", "docs", "docs-site"]
